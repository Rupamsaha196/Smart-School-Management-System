services:
  # ── Backend: Laravel API (Web Service) ──────────────────────────────
  - type: web
    name: smart-school-backend
    runtime: php
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    startCommand: php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: SmartSchool
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: smart-school-backend
          property: host
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/data/database.sqlite
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_LIFETIME
        value: "120"
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: SANCTUM_STATEFUL_DOMAINS
        value: smart-school-frontend.onrender.com
      - key: SESSION_DOMAIN
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://smart-school-frontend.onrender.com
    disk:
      name: smart-school-db
      mountPath: /var/data
      sizeGB: 1
    healthCheckPath: /api/health

  # ── Frontend: React (Static Site) ───────────────────────────────────
  - type: static
    name: smart-school-frontend
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smart-school-backend
          property: host
